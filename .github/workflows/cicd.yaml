name: Run CI
on: [push, pull_request]

jobs:
  normal_ci:
    runs-on: ubuntu-latest
    steps:
      - name: Run normal CI
        run: |
          echo "${{ github.event.head_commit.message }}"
          echo "${{ github.event.head_commit.author }}"
          echo "${{ github.event.head_commit.author.username }}"
          echo "${{ github.event.pusher.date}}"
          echo "${{ github.event.pusher.username}}"